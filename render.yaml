services:
  - type: web
    name: asistente-mayores-backend
    runtime: python
    repo: https://github.com/mrezk84/AsistenteMayoresAI
    rootDir: asistente-backend
    region: ohio
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: API_SECRET_TOKEN
        value: "asistente-mayores-token-2024"
      - key: JWT_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asistente-mayores-db
          property: connectionString

databases:
  - name: asistente-mayores-db
    databaseName: asistente_mayores
    user: asistente_mayores_user
    plan: free
